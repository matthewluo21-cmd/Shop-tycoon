function barChartSVG() {
  const data = unlocked().map(d => ({ label: d.emoji, name: d.name, v: S.today.sold[d.id] || 0 }));
  const W = 340, H = 170, pl = 30, pb = 26, pt = 12, pr = 8;
  const max = Math.max(4, ...data.map(d => d.v));
  const step = Math.ceil(max / 4), top = step * 4;
  const bw = (W - pl - pr) / data.length;
  const y = v => pt + (1 - v / top) * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = k * step; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 4}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }
  data.forEach((d, i) => {
    const x = pl + i * bw + bw * 0.2, w = bw * 0.6;
    g += `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${H - pb - y(d.v)}" fill="var(--gain)" stroke="var(--ink)" stroke-width="1.5" rx="3"><title>${esc(d.name)}: ${d.v}</title></rect>`;
    g += `<text x="${x + w / 2}" y="${y(d.v) - 4}" text-anchor="middle" font-weight="700">${d.v}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" style="font-size:16px">${d.label}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of items sold today: ${data.map(d => `${esc(d.name)} ${d.v}`).join(', ')}">${g}</svg>`;
}

function lineChartSVG() {
  const hist = S.history.slice(-7);
  const W = 340, H = 180, pl = 52, pr = 14, pt = 14, pb = 26;
  const vals = hist.map(h => h.profit);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max - min < 20) { max += 10; if (min < 0) min -= 10; }
  const pad = (max - min) * 0.1; max += pad; if (min < 0) min -= pad;
  const x = i => hist.length === 1 ? (pl + (W - pl - pr) / 2) : pl + i * (W - pl - pr) / (hist.length - 1);
  const y = v => pt + (max - v) / (max - min) * (H - pt - pb);
  let g = `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)" stroke-dasharray="4 4"/>`;
  g += `<text x="${pl - 6}" y="${y(0) + 4}" text-anchor="end">$0</text>`;
  g += `<text x="${pl - 6}" y="${pt + 8}" text-anchor="end">$${Math.round(max)}</text>`;
  if (min < 0) g += `<text x="${pl - 6}" y="${H - pb}" text-anchor="end">−$${Math.abs(Math.round(min))}</text>`;
  if (hist.length > 1) g += `<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${hist.map((h, i) => `${x(i)},${y(h.profit)}`).join(' ')}"/>`;
  hist.forEach((h, i) => {
    const c = h.profit < 0 ? 'var(--loss)' : 'var(--gain)';
    g += `<circle cx="${x(i)}" cy="${y(h.profit)}" r="5" fill="${c}" stroke="var(--ink)"><title>Day ${h.day}: ${money(h.profit)}</title></circle>`;
    g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">Day ${h.day}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of daily profit: ${hist.map(h => `day ${h.day} ${money(h.profit)}`).join(', ')}">${g}</svg>`;
}

        <option value="H" ${SETTINGS.kumon === 'H' ? 'selected' : ''}>Algebra and equations (around level H and above)</option>
      </select><br><span class="hint">When on, about 2 in 5 bonus questions come from these topics. Kumon level contents are approximate; check with the Kumon instructor which area your child is working on.</span></p>
    <p><label><input type="checkbox" id="setWrong" ${SETTINGS.wrongPenalty ? 'checked' : ''}> Wrong answers also lose 1 maths point (by default only skips do)</label></p>

  start: () => newGame(newSlot, ($('#shopName').value || '').trim().slice(0, 24) || 'My Shop', selectedTheme),
  slots: () => goToSlots(),
  qty: b => { const id = b.dataset.id; buyQty[id] = Math.max(0, (buyQty[id] || 0) + Number(b.dataset.d)); renderPanel(); },
  buy: b => buyItem(b.dataset.id),
  move: b => moveStock(b.dataset.id, b.dataset.dir),
  loan: () => { S.cash = round2(S.cash + CONFIG.loanAmount); S.loan = CONFIG.loanAmount + CONFIG.loanFee; save(); render(); },
  payloan: () => { if (S.cash >= S.loan) { S.cash = round2(S.cash - S.loan); S.loan = 0; toast('Loan paid off!'); save(); render(); } },
  toPricing: () => { S.phase = 'pricing'; save(); render(); },
  toMorning: () => { S.phase = 'morning'; save(); render(); },
  sale: b => { const sel = document.querySelector(`[data-salepct="${b.dataset.id}"]`); runSale(b.dataset.id, sel.value); },
  open: () => openShop(),
  speed: b => { speed = Number(b.dataset.v); document.querySelectorAll('[data-act="speed"]').forEach(x => x.setAttribute('aria-pressed', Number(x.dataset.v) === speed)); },
  bonus: async b => {
    const q = makeBonusQuestion(Number(b.dataset.tier) || fixedTier(0));
    S.today.bonusAsked = true;
    if (!q) { toast('No bonus question today. Sell something first!'); save(); render(); return; }
    await ask(q);
    updateLastHistory(); checkBadges();
    const ups = checkLevel();
    save(); render();
    if (ups.length) showLevelUp(ups);
  },
  insure: () => {
    if (!S.insured && S.cash < insCost()) { toast('Not enough cash for insurance.'); return; }
    S.insured = !S.insured; save(); render();
  },
  tab: b => { shopTab = b.dataset.v; renderPanel(); },
  buyacc: b => buyAccessory(b.dataset.id),
  buyroom: b => buyRoom(b.dataset.id),
  next: () => nextDay(),
  boss: () => runBoss(),
  hire: b => hireStaff(b.dataset.id),
  fire: b => fireStaff(b.dataset.id),
  customise: () => showCustomise(),
  guide: () => showShopperGuide(),
  badges: () => showBadges(),
  parent: () => showParent()
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.closest('.modal')) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (!S) return;
  if (el.dataset.qty) {
    const id = el.dataset.qty;
    const v = Math.max(0, Math.floor(Number(el.value) || 0));
    buyQty[id] = v;
    $('#tot-' + id).textContent = money(S.today.wholesale[id] * v);
    $('#totl-' + id).textContent = totalLabel(v);
    const bb = $('#buy-' + id); if (bb) bb.disabled = v <= 0;
  } else if (el.dataset.price) {
    const id = el.dataset.price;
    let v = Number(el.value);
    if (!(v > 0)) { $('#mk-' + id).textContent = '–'; return; }
    v = feature('cents') ? round2(v) : Math.round(v);
    S.items[id].price = v;
    $('#mk-' + id).textContent = markupText(v, S.today.wholesale[id]);
    save();
  } else if (el.dataset.rule) {
    const r = S.items[el.dataset.rule].rule, f = el.dataset.f;
    if (f === 'on') r.on = el.checked;
    else r[f] = clamp(Math.floor(Number(el.value) || 0), 0, shelfMax());
    save();
  } else if (el.dataset.dest) {
    buyDest[el.dataset.dest] = el.value;
  }
});

document.addEventListener('change', e => {
  if (!S) return;
  if (e.target.dataset.qty) { const id = e.target.dataset.qty; e.target.value = buyQty[id] || 0; }
  if (e.target.dataset.price) { const id = e.target.dataset.price; const p = S.items[id].price; e.target.value = feature('cents') ? p.toFixed(2) : p; }
  if (e.target.dataset.dest) buyDest[e.target.dataset.dest] = e.target.value;
});

document.addEventListener('keydown', e => {
  if ((e.key === 'p' || e.key === 'P') && S && !modalOpen() && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) showParent();
});

(function init() {
  migrateV1();
  S = null; screen = 'slots';
  render();
})();
</script>
</body>
</html>
