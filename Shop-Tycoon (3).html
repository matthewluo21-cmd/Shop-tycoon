:root{
  --bg:#E4F2F8; --panel:#FFFFFF; --ink:#1D2B44; --muted:#55667D; --line:#C6D5E2;
  --awning-2:#FFFFFF; --mustard:#F4B82E; --gain:#1A7549; --loss:#C2372D;
  --wall:#FCE6B6; --floor:#EBD6AE; --floor-2:#DFC595; --soft:#EEF6FA; --wood:#A8703F; --wood-2:#8A5A30;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121E2C; --panel:#1B2A3C; --ink:#EAF1F8; --muted:#A9B8CA; --line:#33475E;
    --awning-2:#1B2A3C; --gain:#4FC78E; --loss:#FF7F73;
    --wall:#3A3322; --floor:#2E2718; --floor-2:#272114; --soft:#22344A; --wood:#7A5230; --wood-2:#5E3E22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E2C; --panel:#1B2A3C; --ink:#EAF1F8; --muted:#A9B8CA; --line:#33475E;
  --awning-2:#1B2A3C; --gain:#4FC78E; --loss:#FF7F73;
  --wall:#3A3322; --floor:#2E2718; --floor-2:#272114; --soft:#22344A; --wood:#7A5230; --wood-2:#5E3E22;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Fredoka','Atkinson Hyperlegible',system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(34px,6vw,54px)}
h2{font-size:26px}
h3{font-size:21px}
p{margin:.4em 0}
.wrap{max-width:1040px;margin:0 auto;padding:12px 14px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.chip.cash{border-color:var(--gain)}
.chip.debt{border-color:var(--loss)}
.spacer{flex:1}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 6px;font-size:15px}
.progress{flex-basis:100%;font-size:14px;color:var(--muted)}
.lvlbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px;max-width:420px}
.lvlbar div{height:100%;background:var(--gain)}

/* ===== Shop stage ===== */
.stage{position:relative;aspect-ratio:16/8.4;background:var(--wall);border:3px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;overflow:hidden;--e:clamp(18px,3.1vw,34px)}
.st-awning{position:absolute;left:0;right:0;top:0;height:11%;background:repeating-linear-gradient(90deg,var(--awn) 0 40px,var(--awning-2) 40px 80px);border-bottom:3px solid var(--ink);z-index:2}
.st-sign{position:absolute;top:1.4%;left:50%;transform:translateX(-50%) rotate(-1.2deg);background:var(--ink);color:var(--mustard);z-index:3;
  font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:clamp(14px,2.5vw,27px);padding:0 18px 2px;border-radius:10px;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.st-floor{position:absolute;left:0;right:0;top:36%;bottom:0;border-top:3px solid var(--ink);
  background:conic-gradient(var(--floor) 25%,var(--floor-2) 0 50%,var(--floor) 0 75%,var(--floor-2) 0) 0 0/44px 44px}
.st-door{position:absolute;left:0;top:62%;width:2.6%;height:34%;background:var(--wood-2);border:2px solid var(--ink);border-left:none;border-radius:0 6px 6px 0}
.obj{position:absolute;transform:translate(-50%,-100%);font-size:var(--e);line-height:1;text-align:center;pointer-events:none;white-space:nowrap}
.obj.sm{font-size:calc(var(--e)*.6)}
.room{position:absolute;top:15%;height:21%;width:6.6%;background:var(--soft);border:2px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--e)*.75);line-height:1;z-index:1}
.room small{font-size:clamp(7px,.95vw,11px);font-family:'Atkinson Hyperlegible',sans-serif;margin-top:3px;text-align:center;line-height:1.05;padding:0 2px}
.shelf-unit{position:absolute;top:37.5%;height:16%;border:2px solid var(--ink);border-radius:6px;z-index:3;
  background:repeating-linear-gradient(180deg,var(--wood) 0 calc(50% - 3px),var(--wood-2) calc(50% - 3px) 50%);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:1px}
.shelf-unit.big{height:20%}
.shelf-row{font-size:calc(var(--e)*.42);line-height:1;letter-spacing:-1px;min-height:1em}
.shelf-tag{position:absolute;bottom:-1.2em;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;font-size:clamp(9px,1.1vw,12px);font-weight:700;padding:0 4px;white-space:nowrap}
.shelf-unit.empty{opacity:.55}
.counter{position:absolute;width:13%;height:8%;background:var(--wood);border:2px solid var(--ink);border-radius:6px;z-index:40;display:flex;align-items:center;justify-content:flex-start;padding-left:6px;font-size:calc(var(--e)*.7)}
.keeper{position:absolute;transform:translate(-50%,-100%);font-size:var(--e);z-index:39}
.vending{position:absolute;width:4.5%;height:15%;background:#C2372D;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;font-size:calc(var(--e)*.6);z-index:3}
.neon{position:absolute;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(11px,1.9vw,22px);color:#FF4FA3;border:2px solid #FF4FA3;border-radius:8px;padding:0 6px;transform:translate(-50%,-100%);
  text-shadow:0 0 6px #FF4FA3;box-shadow:0 0 8px #FF4FA3;animation:flicker 3s infinite}
.carpet{position:absolute;left:0;width:15%;top:85%;height:7%;background:#C2372D;border-top:2px solid #F4B82E;border-bottom:2px solid #F4B82E}
.mascot{animation:wave 1.4s ease-in-out infinite}
.shopper{position:absolute;transform:translate(-50%,-100%);font-size:var(--e);line-height:1;pointer-events:none}
.shopper .who{display:inline-block}
.shopper.walking .who{animation:walk .32s ease-in-out infinite alternate}
.shopper .bub{position:absolute;bottom:105%;left:50%;transform:translateX(-50%) translateY(4px);background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 6px;
  font-size:clamp(10px,1.2vw,13px);white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;font-family:'Atkinson Hyperlegible',sans-serif}
.shopper.talk .bub{opacity:1;transform:translateX(-50%)}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:'Fredoka',sans-serif;font-weight:700;color:var(--gain);font-size:clamp(12px,1.6vw,18px);z-index:90;animation:rise 1s ease-out forwards;pointer-events:none;
  text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel)}
@keyframes walk{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes wave{0%,100%{transform:translate(-50%,-100%) rotate(-7deg)}50%{transform:translate(-50%,-104%) rotate(7deg)}}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-28px}}
@keyframes flicker{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}97%{opacity:.5}}

/* Panels */
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:0 0 22px 22px;padding:18px}
.panel.alone{border-radius:22px}
.hint{color:var(--muted);font-size:15px}
.lbl{display:block;font-size:13px;color:var(--muted)}
.rows{display:grid;gap:10px;margin:12px 0}
.row{display:grid;grid-template-columns:1.4fr .9fr .9fr 1.7fr 1.3fr;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px}
.row.pricing{grid-template-columns:1.5fr .8fr .9fr 1.1fr .8fr 1.8fr}
.row.store{grid-template-columns:1.4fr 1fr 1fr 2fr}
.row .name{font-size:18px}
.em{font-size:24px}
.stepper{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stepper input{width:58px;text-align:center}
input[type=number],input[type=text],select{border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel)}
input[type=number]{width:96px}
.buycell{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.event{display:flex;gap:14px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px;margin:10px 0}
.event .big{font-size:42px;line-height:1}
.box{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.good{color:var(--gain);font-weight:700}
.bad{color:var(--loss);font-weight:700}

/* Buttons */
.btn{background:var(--mustard);color:#1D2B44;border:2px solid var(--ink);border-radius:12px;padding:.5em 1.1em;cursor:pointer;
  font-family:'Fredoka',system-ui,sans-serif;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--panel);color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;color:var(--muted)}
.btn.danger{background:var(--loss);color:#fff}
.btn.small{padding:.2em .6em;font-size:15px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* Day */
.daystats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.daystats div{background:var(--soft);border-radius:12px;padding:8px 12px}
.daystats b{font-size:24px;font-family:'Fredoka',sans-serif}
.bar{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--soft)}
.bar div{height:100%;width:0;background:var(--gain)}

/* Evening */
.evening{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.receipt{background:#fff;color:#1D2B44;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:15px;
  padding:18px 18px 22px;border:2px solid var(--ink);border-bottom:none;position:relative;margin-bottom:14px}
.receipt::after{content:'';position:absolute;left:-2px;right:-2px;bottom:-12px;height:12px;
  background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/16px 12px repeat-x,
             linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/16px 12px repeat-x}
.r-head{text-align:center;font-weight:700;margin-bottom:10px}
.r-line{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.r-total{display:flex;justify-content:space-between;border-top:2px dashed #1D2B44;margin-top:8px;padding-top:8px;font-weight:700;font-size:18px}
.r-total.loss span:last-child{color:#C2372D}
.r-total.gain span:last-child{color:#1A7549}
.r-note{font-size:13px;margin-top:8px}
figure{margin:0 0 16px}
figcaption{font-weight:700;margin-bottom:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink);font-size:11px;font-family:'Atkinson Hyperlegible',sans-serif}
.tabs{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.card.owned{border-color:var(--gain)}
.card.locked{opacity:.55}
.card .em{font-size:28px}

/* Slots + new shop */
.start-hero{text-align:center;padding:10px 0 4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0}
.slot{border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.slot.filled{border-color:var(--ink)}
.slot .em{font-size:40px;line-height:1}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.theme-btn{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center}
.theme-btn .em{font-size:38px;display:block}
.theme-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.start-field{display:grid;gap:4px;max-width:420px;margin:0 auto}
.start-field input{font-size:20px}

/* v4 additions */
.st-floor.f-wood{background:repeating-linear-gradient(90deg,#C99A6B 0 38px,#B07F50 38px 41px)}
.st-floor.f-tiles{background:linear-gradient(rgba(0,0,0,0) calc(100% - 2px),rgba(0,0,0,.18) 0) 0 0/40px 40px,linear-gradient(90deg,rgba(0,0,0,0) calc(100% - 2px),rgba(0,0,0,.18) 0) 0 0/40px 40px,#E6ECF1}
.st-floor.f-carpet{background:radial-gradient(circle,#9E2F2F 2px,transparent 3px) 0 0/18px 18px,#B73B3B}
.st-floor.f-marble{background:linear-gradient(135deg,#F3F3F3 25%,#DFDFDF 25% 50%,#F3F3F3 50% 75%,#DFDFDF 75%) 0 0/60px 60px}
.st-sign.s-gold{background:#A87A12;color:#FFF6D5}
.st-sign.s-neon{background:#101418;color:#62F0FF;text-shadow:0 0 6px #62F0FF}
.st-sign.s-wood{background:#8A5A30;color:#FFF1D6}
.patrol{animation:patrol 9s ease-in-out infinite alternate}
@keyframes patrol{from{left:20%}to{left:64%}}
.deco{opacity:.9}
.event.boss{border:3px solid var(--loss)}
.event.holiday{border:2px dashed var(--mustard)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{min-width:64px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;padding:4px 10px;font-weight:700}
.swatch[aria-pressed="true"]{border:3px solid var(--ink);box-shadow:0 0 0 2px var(--mustard)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:20px;max-width:560px;width:100%;padding:20px;max-height:92%;overflow:auto}
.modal .topic{color:var(--muted);font-weight:700;margin:0}
.modal .q{font-size:19px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pill{background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.reward{font-size:14px;color:var(--muted);margin-top:6px}
.ans{font-size:22px;width:100%;margin:4px 0 6px}
.choices{display:grid;gap:8px;margin:8px 0}
.choice.right{background:var(--gain);color:#fff}
.choice.wrongpick{background:var(--loss);color:#fff}
.calc{background:var(--soft);border-radius:12px;padding:10px;margin-top:10px}
.calc-row{display:flex;gap:8px}
.calc-row input{flex:1;font-size:18px}
.solution{background:var(--soft);padding:10px 12px;border-radius:10px}
.unlock-list{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.unlock-list li{background:var(--soft);border-radius:10px;padding:6px 10px}
table.stats{border-collapse:collapse;width:100%;font-size:15px}
table.stats th,table.stats td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.badge-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.badge .em{font-size:32px;display:block}
.badge.locked{opacity:.4}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:10px 18px;border-radius:12px;font-weight:700;z-index:300;max-width:90%}

@media (max-width:760px){
  .row,.row.pricing,.row.store{grid-template-columns:1fr 1fr}
  .row .name{grid-column:1/-1}
  .row .wide{grid-column:1/-1}
  .daystats{grid-template-columns:repeat(2,1fr)}
  .evening{grid-template-columns:1fr}
  .stage{aspect-ratio:4/3.2}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

</div>

function parseAnswer(v) {
  const s = String(v).replace(/−/g, '-').replace(/[^0-9.\-\/ ]/g, '').trim();
  if (!s) return null;
  let m = /^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/.exec(s);
  if (m) { const v2 = Number(m[2]) + Number(m[3]) / Number(m[4]); return m[1] ? -v2 : v2; }
  m = /^(-?\d*\.?\d+)\s*\/\s*(\d*\.?\d+)$/.exec(s);
  if (m) { const den = Number(m[2]); return den ? Number(m[1]) / den : null; }
  const n = s.replace(/\s+/g, '');
  if (n === '' || isNaN(Number(n))) return null;
  return Number(n);
}

/* Safe calculator (no eval) */
function evalExpr(src) {
  const s = src.replace(/×|x|X/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s+/g, '');
  let i = 0;
  const num = () => { const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const factor = () => {
    if (s[i] === '-') { i++; return -factor(); }
    if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
    return num();
  };
  const term = () => { let v = factor(); while (s[i] === '*' || s[i] === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return null; return v; } catch (e) { return null; }
}

/* Difficulty tiers: 1 = Year 5 review, 2 = Year 6, 3 = Year 6 stretch, 4 = Year 7, 5 = Year 7 challenge */
const TIER_TAG = ['', 'Year 5 review', 'Year 6', 'Year 6 stretch', 'Year 7', 'Year 7 challenge'];
function baseTier() { const l = S.level; return l <= 2 ? 1 : l <= 4 ? 2 : l <= 7 ? 3 : l <= 10 ? 4 : 5; }
function rollTier(shift) {
  let t = baseTier() + (SETTINGS.challenge || 0) + (shift || 0);
  const r = Math.random(); if (r < 0.25) t--; else if (r > 0.75) t++;
  return clamp(t, 1, 5);
}
function fixedTier(shift) { return clamp(baseTier() + (SETTINGS.challenge || 0) + (shift || 0), 1, 5); }
const tierReward = tier => Math.round(CONFIG.tierCash[tier - 1] * (1 + CONFIG.rewardGrowth * (S.level - 1)));
const tierPoints = tier => CONFIG.tierPoints[tier - 1];
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

function recordAnswer(p, outcome, used) {
  const tier = p.tier || 1;
  const st = S.stats[p.topic] || (S.stats[p.topic] = { right: 0, wrong: 0, skip: 0, calc: 0 });
  const ts = S.tierStats[tier] || (S.tierStats[tier] = { right: 0, wrong: 0, skip: 0 });
  let cash = 0, pts = 0;
  if (used) st.calc++;
  if (outcome === 'right' || outcome === 'retry') {
    st.right++; ts.right++; S.totalCorrect++;
    if (outcome === 'right') {
      cash = Math.round(tierReward(tier) * (used ? 1 : 1.5)); pts = tierPoints(tier);
      S.streak++; S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
      if (!used) S.mentalCorrect++;
    } else { cash = Math.round(tierReward(tier) * 0.5); pts = 1; }
  } else if (outcome === 'skip') {
    st.skip++; ts.skip++; S.skips = (S.skips || 0) + 1; S.streak = 0;
    pts = (S.mathPoints || 0) > 0 ? -1 : 0;
  } else {
    st.wrong++; ts.wrong++; S.streak = 0;
    if (SETTINGS.wrongPenalty) pts = (S.mathPoints || 0) > 0 ? -1 : 0;
  }
  S.mathPoints = Math.max(0, (S.mathPoints || 0) + pts);
  if (cash) { S.cash = round2(S.cash + cash); if (S.today) S.today.bonus = round2(S.today.bonus + cash); }
  checkBadges(); save(); renderTop();
  return { cash, pts };
}

function maybeAsk(p) {
  if (!p || !S.today || S.today.prompts >= CONFIG.maxPromptsPerDay) return Promise.resolve(null);
  S.today.prompts++;
  return ask(p);
}

function ask(p) {
  return new Promise(resolve => {
    const tier = p.tier || 1, reward = tierReward(tier), pts = tierPoints(tier);
    const tol = p.tol != null ? p.tol : 0.005;
    const shown = p.display != null ? p.display : (p.money ? money(p.answer) : numStr(p.answer));
    let used = false, done = false, tries = 0;
    const input = p.choices
      ? `<div class="choices">${p.choices.map((c, i) => `<button class="btn secondary choice" data-i="${i}">${esc(c)}</button>`).join('')}</div>`
      : `<label class="lbl" for="ans">Your answer${p.fracOk ? ' (fractions like 3/4 or 1 1/2 are fine)' : ''}</label><input id="ans" class="ans" type="text" inputmode="${p.fracOk ? 'text' : 'decimal'}" autocomplete="off" placeholder="${p.money ? 'e.g. 12.50' : 'Type your answer'}">`;
    const box = openModal(`
      <div class="qmeta"><span class="pill">${TIER_TAG[tier]}</span><span class="pill">${TOPICS[p.topic] || 'Maths'}</span>${p.kumon ? '<span class="pill">Kumon-style</span>' : ''}<span class="pill" aria-label="Difficulty ${tier} out of 5">${stars(tier)}</span></div>
      <h3>${esc(p.title || 'Maths challenge')}</h3>
      <p class="q">${p.q}</p>
      ${input}
      <p class="reward">Worth <strong>${money(reward)}</strong> (${money(Math.round(reward * 1.5))} without the calculator) and <strong>${pts} maths point${pts > 1 ? 's' : ''}</strong>. Skipping loses 1 maths point${SETTINGS.wrongPenalty ? ', and so does a wrong answer' : ''}.</p>
      <div class="calc" hidden>
        <label class="lbl" for="calcIn">Calculator (type a sum like 68 * 0.85)</label>
        <div class="calc-row"><input id="calcIn" type="text" autocomplete="off"><button class="btn secondary" id="calcGo">=</button></div>
        <output id="calcOut" aria-live="polite"></output>
      </div>
      <div class="feedback" aria-live="polite"></div>
      <div class="actions" id="askActions">
        ${p.choices ? '' : '<button class="btn" id="checkBtn">Check</button>'}
        <button class="btn secondary" id="calcBtn" ${S.calcTokens <= 0 ? 'disabled' : ''}>Use calculator (${S.calcTokens} left)</button>
        <button class="btn ghost" id="skipBtn">Skip (−1 point)</button>
      </div>`, 'Maths challenge');
    const fb = box.querySelector('.feedback');

    function finish(outcome) {
      if (done) return; done = true;
      const r = recordAnswer(p, outcome, used);
      let html;
      if (outcome === 'right') html = `<p class="good">Correct! +${money(r.cash)} and +${r.pts} maths point${r.pts > 1 ? 's' : ''}.</p>`;
      else if (outcome === 'retry') html = `<p class="good">Got it on the second go! +${money(r.cash)} and +1 maths point.</p>`;
      else if (outcome === 'wrong') html = `<p class="bad">Not this time${r.pts < 0 ? ' (−1 maths point)' : ''}. The answer is ${shown}.</p>`;
      else html = `<p class="bad">Skipped${r.pts < 0 ? ': −1 maths point' : ''}. The answer is ${shown}.</p>`;
      if (p.solution) html += `<p class="solution"><strong>How to work it out:</strong> ${p.solution}</p>`;
      fb.innerHTML = html;
      box.querySelectorAll('.choice, .ans').forEach(e => e.disabled = true);
      box.querySelector('#askActions').innerHTML = '<button class="btn" id="contBtn">Continue</button>';
      const c = box.querySelector('#contBtn');
      c.focus();
      c.addEventListener('click', () => { closeModal(); resolve({ outcome, used }); });
    }
    function firstMiss() {
      tries = 1;
      fb.innerHTML = `<p class="bad">Not quite. Have another go for half the reward.</p>${p.hint ? `<p class="solution"><strong>Hint:</strong> ${p.hint}</p>` : ''}`;
      const acts = box.querySelector('#askActions');
      if (!acts.querySelector('#revealBtn')) {
        acts.insertAdjacentHTML('beforeend', '<button class="btn ghost" id="revealBtn">Show me the answer</button>');
        acts.querySelector('#revealBtn').addEventListener('click', () => finish('wrong'));
      }
    }
    if (p.choices) {
      box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.i);
        if (i === p.correctIndex) { b.classList.add('right'); finish(tries ? 'retry' : 'right'); return; }
        b.classList.add('wrongpick'); b.disabled = true;
        if (tries || p.choices.length <= 2) finish('wrong'); else firstMiss();
      }));
      box.querySelector('.choice').focus();
    } else {
      const inp = box.querySelector('#ans');
      inp.focus();
      const check = () => {
        const v = parseAnswer(inp.value);
        if (v === null) { fb.innerHTML = '<p>Type a number first, or press Skip.</p>'; return; }
        if (Math.abs(v - p.answer) <= tol + 1e-9) finish(tries ? 'retry' : 'right');
        else if (tries) finish('wrong');
        else { firstMiss(); box.querySelector('#checkBtn').textContent = 'Check again'; inp.select(); }
      };
      box.querySelector('#checkBtn').addEventListener('click', check);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    }
    box.querySelector('#skipBtn').addEventListener('click', () => finish('skip'));
    box.querySelector('#calcBtn').addEventListener('click', e => {
      if (used || S.calcTokens <= 0) return;
      S.calcTokens--; used = true; save(); renderTop();
      box.querySelector('.calc').hidden = false;
      e.currentTarget.disabled = true; e.currentTarget.textContent = 'Calculator on';
      box.querySelector('#calcIn').focus();
    });
    const runCalc = () => {
      const r = evalExpr(box.querySelector('#calcIn').value);
      box.querySelector('#calcOut').textContent = r === null ? 'Check your sum.' : '= ' + (Math.round(r * 10000) / 10000);
    };
    box.querySelector('#calcGo').addEventListener('click', runCalc);
    box.querySelector('#calcIn').addEventListener('keydown', e => { if (e.key === 'Enter') runCalc(); });
  });
}

/* ============================================================
   QUESTION ENGINE — every question is built for a tier (1–5)
   ============================================================ */
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
function fracStr(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return String(n).replace('-', '−');
  const sign = n < 0 ? '−' : '', a = Math.abs(n);
  return a > d ? `${sign}${Math.floor(a / d)} ${a % d}/${d}` : `${sign}${a}/${d}`;
}
const numStr = v => (Number.isInteger(v) ? String(v) : String(Math.round(v * 10000) / 10000)).replace('-', '−');
const sgn = v => v < 0 ? `(−${Math.abs(v)})` : String(v);
const dollars = v => (v < 0 ? '−$' : '$') + (Number.isInteger(v) ? Math.abs(v) : Math.abs(v).toFixed(2));
const sgnD = v => v < 0 ? `(${dollars(v)})` : dollars(v);
const qty = (k, d) => `${k} × ${esc(d.name)}`;
const sup = n => ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶'][n];
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

const Q = {
  saleOptions(tier) { return [[10, 50], [20, 25], [15, 30, 35], [[20, 10], [25, 10]], [[25, 10], [30, 15], [20, 15]]][tier - 1]; },
  sale(tier, d, price, opt) {
    const base = { topic: 'pct', tier };
    if (Array.isArray(opt)) {
      const [a, b] = opt, k = (1 - a / 100) * (1 - b / 100);
      const p1 = round2(price * (1 - a / 100)), p2 = round2(p1 * (1 - b / 100));
      if (tier >= 5) {
        const overall = round2(100 - k * 100);
        return { sale: p2, q: { ...base, title: 'Double discount', tol: 0.05, display: numStr(overall) + '%',
          q: `Your ${esc(d.name)} is ${a}% off, then an extra ${b}% off the new price. What is the <strong>total</strong> percentage off? (Careful: it isn't ${a + b}%.)`,
          answer: overall, hint: `Work out how much of the price is left: ${1 - a / 100} × ${1 - b / 100}.`,
          solution: `${1 - a / 100} × ${1 - b / 100} = ${numStr(k)}, so ${numStr(k * 100)}% of the price is left. Total discount = 100% − ${numStr(k * 100)}% = ${numStr(overall)}%.` } };
      }
      return { sale: p2, q: { ...base, title: 'Double discount', money: true,
        q: `Your ${esc(d.name)} costs ${money(price)}. Take ${a}% off, then another ${b}% off the new price. What is the final sale price?`,
        answer: p2, hint: `Two steps. First find ${100 - a}% of ${money(price)}.`,
        solution: `${100 - a}% of ${money(price)} = ${money(p1)}. Then ${100 - b}% of ${money(p1)} = ${money(p2)}.` } };
    }
    const off = round2(price * opt / 100), sale = round2(price - off);
    const hints = { 10: '10% means divide by 10.', 50: '50% is half.', 20: 'Find 10%, then double it.', 25: '25% is a quarter, so divide by 4.', 15: 'Find 10%. Half of that is 5%. Add them together.', 30: 'Find 10%, then multiply by 3.', 35: 'Find 10% × 3, then add 5%.' };
    return { sale, q: { ...base, title: 'Sale time', money: true,
      q: `Your ${esc(d.name)} normally costs ${money(price)}. Today it is ${opt}% off. What is the sale price?`,
      answer: sale, hint: hints[opt] || '', solution: `${opt}% of ${money(price)} is ${money(off)}. Then ${money(price)} − ${money(off)} = ${money(sale)}.` } };
  },

  bulkDeal(tier) { return [[10], [pick([20, 25])], [15], [12.5], [15, 5]][tier - 1]; },
  bulk(tier, n, unit, deal) {
    const total = round2(unit * n), base = { topic: 'pct', tier, title: 'Bulk deal', money: true };
    if (deal.length === 2) {
      const [a, b] = deal, p1 = round2(total * (1 - a / 100)), pay = round2(p1 * (1 - b / 100));
      return { pay, q: { ...base, q: `${n} × ${money(unit)} = ${money(total)}. Bulk deal: ${a}% off, then a ${b}% loyalty discount on the new total. How much do you pay?`,
        answer: pay, hint: `Two steps: ${100 - a}% of ${money(total)}, then ${100 - b}% of that.`, solution: `${100 - a}% of ${money(total)} = ${money(p1)}. ${100 - b}% of ${money(p1)} = ${money(pay)}.` } };
    }
    const pct = deal[0], off = round2(total * pct / 100), pay = round2(total - off);
    const hints = { 10: 'Divide by 10 to find 10%.', 20: 'Find 10%, then double it.', 25: '25% is a quarter.', 15: '10% plus half of 10%.', 12.5: '12.5% is one-eighth, so divide by 8.' };
    return { pay, q: { ...base, q: `${n} × ${money(unit)} = ${money(total)}. You get ${pct}% off for buying in bulk. How much do you pay?`,
      answer: pay, hint: hints[pct], solution: `${pct}% of ${money(total)} is ${money(off)}. Then ${money(total)} − ${money(off)} = ${money(pay)}.` } };
  },

  change(tier, d, price) {
    const notes = [5, 10, 20, 50, 100, 200], base = { topic: 'money', tier, title: 'Give the right change', money: true };
    const noteFor = v => notes.find(x => x > v + 0.001);
    if (tier === 1) {
      const p = Math.max(1, Math.round(price)), note = noteFor(p); if (!note) return null;
      return { ...base, q: `A shopper buys ${qty(1, d)} for $${p} and pays with a $${note} note. How much change do they get?`, answer: note - p, hint: `Count up from $${p} to $${note}.`, solution: `$${note} − $${p} = $${note - p}.` };
    }
    if (tier === 2) {
      const note = noteFor(price); if (!note) return null; const ch = round2(note - price);
      return { ...base, q: `A shopper buys ${qty(1, d)} for ${money(price)} and pays with a $${note} note. How much change?`, answer: ch, hint: `Count up: from ${money(price)} to the next whole dollar, then up to $${note}.`, solution: `${money(note)} − ${money(price)} = ${money(ch)}.` };
    }
    if (tier === 3) {
      const k = randInt(2, 4), tot = round2(price * k), note = noteFor(tot); if (!note) return null; const ch = round2(note - tot);
      return { ...base, q: `A shopper buys ${qty(k, d)} at ${money(price)} each and pays with a $${note} note. How much change?`, answer: ch, hint: `First find the total: ${k} × ${money(price)}.`, solution: `${k} × ${money(price)} = ${money(tot)}. ${money(note)} − ${money(tot)} = ${money(ch)}.` };
    }
    const others = unlocked().filter(x => x.id !== d.id);
    if (tier === 4 && others.length) {
      const d2 = pick(others), p2 = S.items[d2.id].price, k1 = randInt(1, 3), k2 = randInt(1, 2);
      const tot = round2(price * k1 + p2 * k2), note = noteFor(tot); if (!note) return null; const ch = round2(note - tot);
      return { ...base, q: `A shopper buys ${qty(k1, d)} at ${money(price)} each and ${qty(k2, d2)} at ${money(p2)} each, and pays with a $${note} note. How much change?`, answer: ch, hint: 'Work out each item total, add them, then subtract from the note.', solution: `${k1} × ${money(price)} + ${k2} × ${money(p2)} = ${money(tot)}. ${money(note)} − ${money(tot)} = ${money(ch)}.` };
    }
    const k = randInt(3, 6), tot = round2(price * k), pay = round2(tot * 0.9), note = noteFor(pay); if (!note) return null; const ch = round2(note - pay);
    return { ...base, tier: 5, q: `A member buys ${qty(k, d)} at ${money(price)} each and gets 10% off the total. They pay with a $${note} note. How much change?`, answer: ch, hint: `Total first (${k} × ${money(price)}), then take off 10%, then work out the change.`, solution: `${k} × ${money(price)} = ${money(tot)}. 10% off leaves ${money(pay)}. ${money(note)} − ${money(pay)} = ${money(ch)}.` };
  },

  loss(tier, kind) {
    const cands = unlocked().map(d => ({ d, st: S.items[d.id].stock })).filter(c => c.st >= 4);
    if (!cands.length) return null;
    const thief = kind === 'thief';
    const verb = thief ? 'A shoplifter grabbed' : 'Water damaged';
    const title = thief ? 'Stop, thief!' : 'Leaky roof!';
    for (let tr = tier; tr >= 1; tr--) {
      const opts = [];
      cands.forEach(c => {
        if (tr === 1) [2, 4].forEach(den => { if (c.st % den === 0) opts.push({ c, k: 'unit', n: 1, den }); });
        if (tr === 2) [3, 5, 10].forEach(den => { if (c.st % den === 0) opts.push({ c, k: 'unit', n: 1, den }); });
        if (tr === 3) [[2, 3], [3, 4], [2, 5], [3, 5]].forEach(([n, den]) => { if (c.st % den === 0) opts.push({ c, k: 'unit', n, den }); });
        if (tr === 4) [10, 20, 25, 50].forEach(p => { if (c.st * p % 100 === 0) opts.push({ c, k: 'pct', p }); });
        if (tr === 5) [[4, 3], [5, 4]].forEach(([d1, d2]) => { if (c.st % d1 === 0) opts.push({ c, k: 'two', d1, d2 }); });
      });
      if (!opts.length) continue;
      const o = pick(opts), st = o.c.st, d = o.c.d, nm = esc(d.name);
      const base = { topic: o.k === 'pct' ? 'pct' : 'frac', tier: tr, title };
      if (o.k === 'unit') {
        const lost = st * o.n / o.den, left = st - lost;
        return { d, lost, q: { ...base, q: `${verb} <strong>${o.n}/${o.den}</strong> of your ${st} ${nm}. How many are left on the shelf?`, answer: left,
          hint: o.n === 1 ? `Find 1/${o.den} by dividing ${st} by ${o.den}.` : `Find 1/${o.den} first (${st} ÷ ${o.den}), then multiply by ${o.n}.`,
          solution: `1/${o.den} of ${st} = ${st / o.den}${o.n > 1 ? `, so ${o.n}/${o.den} = ${lost}` : ''}. ${st} − ${lost} = ${left}.` } };
      }
      if (o.k === 'pct') {
        const lost = st * o.p / 100, left = st - lost;
        return { d, lost, q: { ...base, q: `${verb} <strong>${o.p}%</strong> of your ${st} ${nm}. How many are left on the shelf?`, answer: left,
          hint: `${o.p}% is the same as ${fracStr(o.p, 100)}.`, solution: `${o.p}% of ${st} = ${lost}. ${st} − ${lost} = ${left}.` } };
      }
      const first = st / o.d1, rest = st - first, second = rest / o.d2, left = rest - second;
      return { d, lost: first + second, q: { ...base, q: `${verb} <strong>1/${o.d1}</strong> of your ${st} ${nm}, ${thief ? 'then came back for' : 'then more water ruined'} <strong>1/${o.d2} of what was left</strong>! How many are left?`, answer: left,
        hint: `Step by step: take away 1/${o.d1} first, then find 1/${o.d2} of the new amount.`, solution: `1/${o.d1} of ${st} = ${first}, leaving ${rest}. 1/${o.d2} of ${rest} = ${second}, leaving ${left}.` } };
    }
    return null;
  },

  room(tier, name) {
    const nm = esc(name.toLowerCase()), base = { topic: 'meas', tier, title: `Measuring the ${nm}` };
    if (tier === 1) { const w = randInt(2, 9), l = randInt(2, 9);
      return { ...base, q: `The ${nm} is a rectangle ${w} m long and ${l} m wide. What is its floor area in square metres?`, answer: w * l, display: `${w * l} m²`, hint: 'Area of a rectangle = length × width.', solution: `${w} × ${l} = ${w * l} m².` }; }
    if (tier === 2) { const w = randInt(4, 12), l = randInt(3, 9);
      return { ...base, q: `The ${nm} is ${w} m by ${l} m. You're putting a decorative strip around all four walls. How many metres of strip do you need?`, answer: 2 * (w + l), display: `${2 * (w + l)} m`, hint: 'Perimeter = add up all four sides.', solution: `${w} + ${l} + ${w} + ${l} = ${2 * (w + l)} m.` }; }
    if (tier === 3) {
      if (Math.random() < 0.5) { const w = randInt(3, 8) + 0.5, l = randInt(2, 6);
        return { ...base, tol: 0.01, q: `The ${nm} is ${w} m long and ${l} m wide. What is its area in square metres?`, answer: w * l, display: `${numStr(w * l)} m²`, hint: `Try ${Math.floor(w)} × ${l}, then add 0.5 × ${l}.`, solution: `${w} × ${l} = ${numStr(w * l)} m².` }; }
      const W = randInt(8, 12), L = randInt(6, 10), a = randInt(2, 4), b = randInt(2, 4);
      return { ...base, q: `The ${nm} is an L-shape: a ${W} m × ${L} m rectangle with a ${a} m × ${b} m corner cut out. What is its area?`, answer: W * L - a * b, display: `${W * L - a * b} m²`, hint: 'Find the area of the big rectangle, then subtract the missing corner.', solution: `${W} × ${L} − ${a} × ${b} = ${W * L} − ${a * b} = ${W * L - a * b} m².` };
    }
    if (tier === 4) {
      if (Math.random() < 0.5) { const w = randInt(3, 8), l = randInt(3, 8), h = 3;
        return { ...base, q: `The ${nm} is ${w} m long, ${l} m wide and ${h} m high. What is its volume in cubic metres?`, answer: w * l * h, display: `${w * l * h} m³`, hint: 'Volume of a rectangular prism = length × width × height.', solution: `${w} × ${l} × ${h} = ${w * l * h} m³.` }; }
      const b = randInt(2, 7) * 2, h = randInt(3, 9);
      return { ...base, q: `Next to the ${nm} is a triangle-shaped garden bed with a base of ${b} m and a height of ${h} m. What is its area?`, answer: b * h / 2, display: `${b * h / 2} m²`, hint: 'Area of a triangle = ½ × base × height.', solution: `½ × ${b} × ${h} = ${b * h / 2} m².` };
    }
    const w = randInt(4, 9), l = randInt(3, 8), rate = pick([12.5, 18.5, 24.75, 32.4]), cost = round2(w * l * rate);
    return { ...base, money: true, q: `You're tiling the ${nm}, which is ${w} m by ${l} m. Tiles cost ${money(rate)} per square metre. What will the tiles cost?`, answer: cost, hint: 'Find the area first, then multiply by the price per square metre.', solution: `Area = ${w} × ${l} = ${w * l} m². ${w * l} × ${money(rate)} = ${money(cost)}.` };
  }
};

    const a = round2(b * p / 100);
    return { title: 'Savings jar', money: true, q: `You put ${p}% of today's $${b} takings into savings. How much is that?`, answer: a, hint: p === 12.5 ? '12.5% is one-eighth.' : p === 75 ? '75% is three-quarters.' : p === 25 ? 'A quarter: divide by 4.' : p % 10 === 5 ? 'Find 10%, then 5% is half of that.' : 'Find 10% first by dividing by 10.', solution: `${p}% of $${b} = ${b} × ${p / 100} = ${money(a)}.` }; } },

  { id: 'int_week', topic: 'int', min: 3, max: 4, make: () => {

function makeBonusQuestion(tier) {
  const t = S.today, soldIds = Object.keys(t.sold);
  const c = { t, soldIds, totalSold: soldIds.reduce((a, id) => a + t.sold[id], 0), priced: unlocked().filter(d => S.items[d.id].price > 0 && t.wholesale[d.id]) };
  const mx = Math.max(0, ...soldIds.map(id => t.sold[id])), tops = soldIds.filter(id => t.sold[id] === mx);
  c.top = tops.length === 1 ? tops[0] : null;
  const pool = POOL.filter(e => !e.need || e.need(c));
  const k = KUMON_TOPICS[SETTINGS.kumon];
  if (k && Math.random() < 0.4) {
    const kp = pool.filter(e => k.includes(e.id));
    if (kp.length) { const e = pick(kp); return buildQ(e, clamp(tier, e.min, e.max), c, true); }
  }
  const fit = pool.filter(e => tier >= e.min && tier <= e.max);
  const e = pick(fit.length ? fit : pool);
  return buildQ(e, clamp(tier, e.min, e.max), c, false);
}
function buildQ(e, tr, c, kumon) { const q = e.make(tr, c); return Object.assign({ topic: e.topic }, q, { tier: q.tier || tr, kumon }); }

/* ============================================================
   Save slots
   ============================================================ */
function blankState(name, themeKey) {
  const s = {
    v: 2, shopName: name || 'My Shop', theme: themeKey, day: 1, level: 1,
    cash: CONFIG.startCash, rep: CONFIG.startRep, items: {}, acc: {}, rooms: {}, history: [], stats: {},
    totalCorrect: 0, streak: 0, bestStreak: 0, mentalCorrect: 0, badges: [], loan: 0, vipSale: false,
    mathPoints: 0, tierStats: {}, skips: 0, staff: {}, custom: {}, bossWins: 0, repTrend: 0,
    phase: 'morning', today: null, forecast: null, insured: false, calcTokens: CONFIG.calcTokensPerDay,
    created: Date.now(), updated: Date.now()
  };
  THEMES[themeKey].items.forEach(d => { s.items[d.id] = { stock: 0, store: 0, price: Math.round(d.cost * 1.5), rule: { on: false, below: 5, order: 10 } }; });
  return s;
}

/* Bring a version 1 save across into slot 1, once. */
function migrateV1() {
  try {
    const raw = localStorage.getItem('shopTycoonSave_v1');
    if (!raw || loadSlot(1)) return;
    const o = JSON.parse(raw);
    if (!o || o.v !== 1 || !THEMES[o.theme]) return;
    const s = blankState(o.shopName, o.theme);
    Object.assign(s, { day: o.day || 1, cash: o.cash || 0, rep: o.rep || 50, history: o.history || [], stats: o.stats || {},
      totalCorrect: o.totalCorrect || 0, bestStreak: o.bestStreak || 0, mentalCorrect: o.mentalCorrect || 0, loan: o.loan || 0 });
    Object.keys(o.items || {}).forEach(id => { if (s.items[id]) { s.items[id].stock = o.items[id].stock || 0; s.items[id].price = o.items[id].price || s.items[id].price; } });
    const map = { shelves: 'shelves', till: 'register2', music: 'speaker', sign: 'neon' };
    Object.keys(o.upgrades || {}).forEach(k => { if (map[k]) s.acc[map[k]] = true; });
    s.badges = (o.badges || []).filter(b => BADGES.some(x => x.id === b));
    s.mathPoints = s.totalCorrect;
    const tp = s.history.reduce((a, h) => a + h.profit, 0);
    while (CONFIG.levels[s.level] && tp >= CONFIG.levels[s.level].profit && s.mathPoints >= CONFIG.levels[s.level].points) s.level++;
    s.today = null;
    localStorage.setItem(slotKey(1), JSON.stringify(s));
    localStorage.removeItem('shopTycoonSave_v1');
  } catch (e) {}
}

function playSlot(n) {
  const s = loadSlot(n);
  if (!s) return;
  S = s; CUR = n; buyQty = {}; buyDest = {};
  if (S.mathPoints == null) S.mathPoints = S.totalCorrect || 0;
  if (!S.tierStats) S.tierStats = {};
  if (S.skips == null) S.skips = 0;
  if (!S.staff) S.staff = {};
  if (!S.custom) S.custom = {};
  if (S.today && S.today.saleTier == null) { S.today.saleTier = rollTier(); S.today.bulkTier = rollTier(); S.today.bulkDeal = Q.bulkDeal(S.today.bulkTier); }
  if (S.phase === 'day' && S.today) { render(); endDay(); return; }
  if (!S.today) { startDay(); return; }
  render();
}

function goToSlots() {
  if (S && S.phase === 'day') { toast('Wait until the shop closes for the day.'); return; }
  save(); clearInterval(dayTimer); dayTimer = null;
  S = null; CUR = 0; screen = 'slots';
  clearShoppers(); render(); window.scrollTo({ top: 0 });
}

/* ============================================================
   Game flow
   ============================================================ */
function newGame(slot, name, themeKey) {
  S = blankState(name, themeKey); CUR = slot;
  startDay();
}

function startDay() {
  S.calcTokens = calcTokensMax();
  buyQty = {};
  const t = { event: 'normal', wholesale: {}, spent: 0, revenue: 0, tips: 0, income: 0, bonus: 0, payout: 0, insurance: 0, sold: {}, lost: 0,
    customers: 0, prompts: 0, notes: [], sales: {}, changeDone: false, bonusAsked: false, lossDone: false, openStock: {}, types: {} };

  let ev = 'normal';
  if (feature('events')) {
    if (S.forecast && Math.random() < S.forecast.chance / 10) { ev = S.forecast.event; t.forecastHit = true; }
    else { ev = weightedPick(DAILY_EVENTS); if (ev === 'heatwave' && seasonIdx(S.day) !== 0) ev = 'normal'; }
  }
  t.event = ev;
  t.partyDay = hasRoom('party') && S.day % 7 === 0;
  t.season = seasonIdx(S.day); t.holiday = holidayOn(S.day);
  t.deco = t.holiday ? t.holiday.emoji : SEASONS[t.season].deco;
  t.mood = {}; t.repStart = S.rep; t.other = 0; t.found = 0;
  const boss = bossFor(S.day); t.boss = boss ? boss.id : null; t.bossDone = !boss;
  t.saleTier = rollTier(); t.bulkTier = rollTier(); t.bulkDeal = Q.bulkDeal(t.bulkTier);
  const E = EVENTS[ev];

  if (S.insured) {
    if (S.cash >= insCost()) { S.cash = round2(S.cash - insCost()); t.insurance = insCost(); t.insured = true; }
    else t.notes.push('You did not have enough cash for insurance, so it was cancelled.');
  }
  S.insured = false;
  if (t.insured && E.bad && !E.loss) { t.payout = CONFIG.insurancePayout; S.cash = round2(S.cash + t.payout); }
  if (E.rep) S.rep = clamp(S.rep + E.rep, 0, 100);
  if (E.cash) { t.found = Math.round(15 * (1 + 0.5 * (S.level - 1))); S.cash = round2(S.cash + t.found); t.notes.push(`You found ${money(t.found)}!`); }
  if (E.block) { const opts = unlocked(); if (opts.length > 1 || S.level > 1) { const b = pick(opts); t.blocked = b.id; t.notes.push(`${b.emoji} ${esc(b.name)} can't be ordered today.`); } }
  if (t.partyDay) t.notes.push('🎉 It\'s party day! Expect 50% more shoppers.');

  unlocked().forEach(d => {
    let c = d.cost;
    if (feature('cents')) c *= (0.95 + Math.random() * 0.1);
    if (E.wholesale) c *= E.wholesale;
    if (hasRoom('workshop')) c *= 0.9;
    t.wholesale[d.id] = round2(c);
  });

  S.today = t;
  S.phase = 'morning';

  // Auto-restock rules (needs the Back office)
  if (hasRoom('office')) {
    unlocked().forEach(d => {
      const it = S.items[d.id], r = it.rule;
      if (!r.on || it.stock >= r.below || r.order <= 0 || d.id === t.blocked) return;
      let want = Math.min(r.order, shelfMax() - it.stock);
      const fromStore = Math.min(want, it.store || 0);
      if (fromStore > 0) { it.store -= fromStore; it.stock += fromStore; want -= fromStore; t.notes.push(`Your rule moved ${fromStore} ${d.emoji} from storage to the shelf.`); }
      if (want <= 0) return;
      const cost = round2(want * t.wholesale[d.id]);
      if (S.cash >= cost) { S.cash = round2(S.cash - cost); t.spent = round2(t.spent + cost); it.stock += want; t.notes.push(`Your rule bought ${want} × ${d.emoji} ${esc(d.name)} for ${money(cost)}.`); }
      else t.notes.push(`Your rule for ${esc(d.name)} could not buy more: not enough cash.`);
    });
  }
  save(); render();
  if (E.loss) handleLoss(E.loss);
}

async function handleLoss(kind) {
  const t = S.today;
  if (t.lossDone) return;
  t.lossDone = true;
  if (kind === 'thief' && hasRoom('security')) { t.notes.push('Your security office caught the shoplifter. Nothing was taken.'); save(); render(); return; }
  if (t.insured) { t.notes.push('Insurance covered it. No stock was lost.'); save(); render(); return; }
  const L = Q.loss(rollTier(), kind);
  if (!L) { t.notes.push(kind === 'thief' ? 'The shoplifter left empty-handed.' : 'Luckily, nothing on the shelves was badly damaged.'); save(); render(); return; }
  await maybeAsk(L.q);
  S.items[L.d.id].stock = Math.max(0, S.items[L.d.id].stock - L.lost);
  t.notes.push(kind === 'thief' ? `The shoplifter took ${L.lost} ${esc(L.d.name)}.` : `The leak ruined ${L.lost} ${esc(L.d.name)}.`);
  save(); render();
}

async function buyItem(id) {
  const q = Math.floor(buyQty[id] || 0);
  if (q <= 0) return;
  const it = S.items[id], d = itemDef(id), t = S.today, unit = t.wholesale[id];
  if (t.blocked === id) { toast(`${d.name} is delayed and can't be ordered today.`); return; }
  const dest = hasRoom('storage') ? (buyDest[id] || 'shelf') : 'shelf';
  if (dest === 'shelf' && it.stock + q > shelfMax()) { toast(`The shelf only holds ${shelfMax()} ${d.name}.`); return; }
  if (dest === 'store' && storageUsed() + q > CONFIG.storageMax) { toast(`The storage room has space for ${CONFIG.storageMax - storageUsed()} more items.`); return; }
  let total = round2(unit * q);
  if (feature('bulk') && q >= CONFIG.bulkThreshold) {
    const B = Q.bulk(t.bulkTier, q, unit, t.bulkDeal);
    if (S.cash < B.pay) { toast(`Not enough cash. You need ${money(B.pay)}.`); return; }
    await maybeAsk(B.q);
    total = B.pay;
  }
  if (S.cash < total) { toast(`Not enough cash. You need ${money(total)}.`); return; }
  S.cash = round2(S.cash - total); t.spent = round2(t.spent + total);
  if (dest === 'store') it.store = (it.store || 0) + q; else it.stock += q;
  buyQty[id] = 0;
  toast(`Bought ${q} ${d.name} for ${money(total)}${dest === 'store' ? ' (in storage)' : ''}.`);
  save(); render();
}

function moveStock(id, dir) {
  const it = S.items[id], d = itemDef(id);
  if (dir === 'toShelf') {
    const n = Math.min(it.store || 0, shelfMax() - it.stock);
    if (n <= 0) { toast(it.store ? 'The shelf is already full.' : 'Nothing in storage.'); return; }
    it.store -= n; it.stock += n; toast(`Moved ${n} ${d.name} to the shelf.`);
  } else {
    const n = Math.min(5, it.stock, CONFIG.storageMax - storageUsed());
    if (n <= 0) { toast(it.stock ? 'The storage room is full.' : 'Nothing on the shelf.'); return; }
    it.stock -= n; it.store = (it.store || 0) + n; toast(`Moved ${n} ${d.name} to storage.`);
  }
  save(); render();
}

async function runSale(id, optStr) {
  const d = itemDef(id), price = S.items[id].price, t = S.today;
  const opt = String(optStr).includes('+') ? String(optStr).split('+').map(Number) : Number(optStr);
  const R = Q.sale(t.saleTier, d, price, opt);
  await maybeAsk(R.q);
  t.sales[id] = R.sale;
  save(); render();
}

function saleOptsHTML() {
  return Q.saleOptions(S.today.saleTier).map(o => Array.isArray(o)
    ? `<option value="${o[0]}+${o[1]}">${o[0]}% off, then ${o[1]}% more</option>`
    : `<option value="${o}">${o}% off</option>`).join('');
}
function bulkText() {
  const d = S.today.bulkDeal || [CONFIG.bulkDiscountPct];
  return d.length === 2 ? `${d[0]}% off, then a further ${d[1]}% off` : `${d[0]}% off`;
}

function openShop() {
  const t = S.today;
  if (t.boss && !t.bossDone) { toast('Face the boss first! Go back to the supplier screen.'); return; }
  const stocked = unlocked().filter(d => S.items[d.id].stock > 0);
  if (!stocked.length) { toast('Put some stock on the shelves first.'); return; }
  for (const d of stocked) if (!(priceOf(d.id) > 0)) { toast(`Set a price for ${d.name}.`); return; }
  t.openStock = {};
  stocked.forEach(d => t.openStock[d.id] = S.items[d.id].stock);
  S.phase = 'day'; speed = 1; paused = false;
  save(); render(); runDay();
}

function shopperCount() {
  const E = EVENTS[S.today.event];
  let n = CONFIG.baseCustomers + S.rep / CONFIG.repDivisor;
  ACCESSORIES.forEach(a => { if (hasAcc(a.id) && a.shoppers) n += a.shoppers; });
  if (hasRoom('garden')) n += 5;
  if (hasRoom('window')) n *= 1.1;
  if (S.today.partyDay) n *= 1.5;
  if (hasStaff('cashier')) n += 3;
  if (hasStaff('greeter')) n += 2;
  const t = S.today, si = t.season != null ? t.season : seasonIdx(S.day), h = t.holiday;
  n *= SEASONS[si].mult * ((THEME_SEASON[S.theme] || [1, 1, 1, 1])[si]);
  if (h) n *= h.mult * ((h.themeBoost || {})[S.theme] || 1);
  if (E.themeMult && E.themeMult[S.theme]) n *= E.themeMult[S.theme] / E.mult;
  if (t.bossBoost) n *= t.bossBoost;
  if (S.rep < 30) n *= 0.8;
  return Math.max(3, Math.round(n * E.mult));
}

function runDay() {
  const n = shopperCount();
  const ctx = { times: Array.from({ length: n }, (_, i) => (i + Math.random()) / n * CONFIG.dayLengthMs), idx: 0, elapsed: 0 };
  const surpriseAt = (S.level >= 2 && Math.random() < 0.45) ? rand(0.3, 0.7) * CONFIG.dayLengthMs : null;
  let surprised = false;
  clearInterval(dayTimer);
  dayTimer = setInterval(() => {
    if (paused) return;
    ctx.elapsed += 100 * speed;
    if (surpriseAt != null && !surprised && ctx.elapsed >= surpriseAt) { surprised = true; applySurprise(ctx); }
    while (ctx.idx < ctx.times.length && ctx.times[ctx.idx] <= ctx.elapsed && !paused) { customerArrives(ctx.elapsed / CONFIG.dayLengthMs); ctx.idx++; }
    const bar = $('#dayBar'); if (bar) bar.style.width = Math.min(100, ctx.elapsed / CONFIG.dayLengthMs * 100) + '%';
    if (ctx.idx >= ctx.times.length && ctx.elapsed >= CONFIG.dayLengthMs) { clearInterval(dayTimer); dayTimer = null; setTimeout(endDay, 900); }
  }, 100);
}

function pickShopperType() {
  const types = ['adult'];
  ACCESSORIES.forEach(a => { if (a.brings && hasAcc(a.id)) types.push(a.brings); });
  const t = S.today;
  if (t && EVENTS[t.event].vip && !types.includes('vip')) types.push('vip');
  if (t && t.holiday && t.holiday.kids && !types.includes('kid')) types.push('kid');
  let r = Math.random() * types.reduce((a, k) => a + SHOPPERS[k].weight, 0);
  for (const k of types) { r -= SHOPPERS[k].weight; if (r <= 0) return k; }
  return 'adult';
}

function customerArrives(progress) {
  const t = S.today;
  const typeKey = pickShopperType(), type = SHOPPERS[typeKey];
  t.types[typeKey] = (t.types[typeKey] || 0) + 1;
  const ids = Object.keys(t.openStock);
  const gifts = t.holiday && t.holiday.gifts ? [...ids].sort((a, b) => itemDef(b).fair - itemDef(a).fair).slice(0, 2) : [];
  const weight = k => (t.sales[k] != null ? 2 : 1) * (type.cheap ? 10 / itemDef(k).fair : 1) * (gifts.includes(k) ? 2.5 : 1);
  if (!t.mood) t.mood = {};
  let tolMult = (EVENTS[t.event].tol || 1) * ((t.holiday && t.holiday.tol) || 1) * (hasStaff('expert') ? 1.05 : 1);
  if (t.rushLeft > 0) { tolMult *= 1.25; t.rushLeft--; }
  let r = Math.random() * ids.reduce((a, k) => a + weight(k), 0), id = ids[ids.length - 1];
  for (const k of ids) { r -= weight(k); if (r <= 0) { id = k; break; } }
  const it = S.items[id], d = itemDef(id), price = priceOf(id);
  t.customers++;
  let face, text, bought = 0;
  if (it.stock <= 0) {
    t.lost++; t.mood.soldout = (t.mood.soldout || 0) + 1; t.soldOutItem = id; face = '😞'; text = `No ${d.emoji} left`;
  } else {
    const ratio = price / (d.fair * type.tol * tolMult);
    let p = buyChance(ratio);
    if (t.sales[id] != null) p += 0.05;
    if (hasRoom('cafe')) p += 0.05;
    if (hasStaff('cashier')) p += 0.03;
    p = Math.min(0.97, p);
    if (Math.random() < p) {
      bought = 1;
      if (type.multi && it.stock >= 2 && Math.random() < type.multi) bought = 2;
      it.stock -= bought;
      const amount = round2(price * bought);
      t.revenue = round2(t.revenue + amount); S.cash = round2(S.cash + amount);
      t.sold[id] = (t.sold[id] || 0) + bought;
      if (hasAcc('goldtill')) { const tip = round2(amount * 0.05); t.tips = round2(t.tips + tip); S.cash = round2(S.cash + tip); }
      if (typeKey === 'vip') S.vipSale = true;
      if (it.stock === 0) t.soldOutMoment = true;
      const md = ratio < 0.85 ? 'loved' : ratio < 1.1 ? 'happy' : 'okay'; t.mood[md] = (t.mood[md] || 0) + 1;
      face = ratio < 0.85 ? '😍' : ratio < 1.1 ? '😀' : '🤔';
      if (it.stock === 0 && hasStaff('clerk') && (it.store || 0) > 0) { const k = Math.min(it.store, shelfMax()); it.store -= k; it.stock += k; toast(`👷 Your stock clerk refilled ${d.name} from storage (${k}).`); }
      text = `${bought > 1 ? '2 × ' : ''}${d.emoji}`;
    } else {
      const md = ratio > 1.15 ? 'walked' : 'browsed'; t.mood[md] = (t.mood[md] || 0) + 1;
      face = ratio > 1.15 ? '😬' : '🤷'; text = ratio > 1.15 ? 'Too pricey' : 'Just looking';
    }
  }
  const shelfIdx = unlocked().findIndex(x => x.id === id);
  walkShopper({ person: pick(type.faces), shelfIdx, say: `${face} ${text}`, bought: bought > 0, pay: bought ? '+' + money(price * bought) : '' });
  renderDayStats(); renderShelves(); renderTop();

  if (bought && feature('change') && !t.changeDone && progress > 0.25 && Math.random() < 0.35 && t.prompts < CONFIG.maxPromptsPerDay) {
    const C = Q.change(rollTier(), d, price);
    if (C) {
      t.changeDone = true; paused = true;
      maybeAsk(C).then(() => { paused = false; renderDayStats(); });
    }
  }
}

/* ---------- Shop floor layout (all % of the stage) ---------- */
const shelfX = i => { const n = Math.max(unlocked().length, 3); const span = 50, start = 17; return start + (i + 0.5) * span / n; };
const REG = [{ x: 85, y: 66 }, { x: 85, y: 84 }];
const roomX = i => 3.5 + i * 7.3;

function walkShopper({ person, shelfIdx, say, bought, pay }) {
  const stage = $('#stage'); if (!stage || stage.hidden) return;
  const el = document.createElement('div');
  el.className = 'shopper';
  el.innerHTML = `<span class="bub"></span><span class="who" aria-hidden="true">${person}</span>`;
  const bub = el.querySelector('.bub');
  const pts = [{ x: -3, y: 90 }, { x: 7, y: rand(80, 88) }];
  pts.push({ x: shelfX(Math.max(0, shelfIdx)) + rand(-1.5, 1.5), y: rand(66, 70), pause: 1000, say });
  // Wander to something fun on the way
  const spots = [];
  if (hasAcc('fountain')) spots.push({ x: 44, y: 90 });
  if (hasAcc('vending')) spots.push({ x: 73, y: 63 });
  if (hasAcc('statue')) spots.push({ x: 60, y: 92 });
  const cafeIdx = ROOMS.findIndex(r => r.id === 'cafe');
  if (hasRoom('cafe')) spots.push({ x: roomX(cafeIdx) + 3.3, y: 41, say: '☕' });
  if (spots.length && Math.random() < 0.35) pts.push({ ...pick(spots), pause: 700 });
  if (bought) {
    const reg = hasAcc('register2') && Math.random() < 0.5 ? 1 : 0;
    pts.push({ x: REG[reg].x - 8, y: REG[reg].y + 6, pause: 700, pay, reg });
  }
  pts.push({ x: -4, y: rand(86, 92) });
  el.style.left = pts[0].x + '%'; el.style.top = pts[0].y + '%';
  stage.appendChild(el);
  if (REDUCE) {
    el.style.left = pts[2].x + '%'; el.style.top = pts[2].y + '%';
    bub.textContent = say; el.classList.add('talk');
    if (bought) coinPop(0, pay);
    setTimeout(() => el.remove(), 1400);
    return;
  }
  let i = 0;
  const go = () => {
    i++;
    if (i >= pts.length || !el.isConnected) { el.remove(); return; }
    const p = pts[i], q = pts[i - 1];
    const dist = Math.hypot(p.x - q.x, (p.y - q.y) * 0.6);
    const ms = Math.max(200, dist * 32 / speed);
    el.classList.add('walking');
    el.style.transition = `left ${ms}ms linear, top ${ms}ms linear`;
    el.style.left = p.x + '%'; el.style.top = p.y + '%';
    el.style.zIndex = String(10 + Math.round(p.y));
    setTimeout(() => {
      el.classList.remove('walking');
      if (p.say) { bub.textContent = p.say; el.classList.add('talk'); }
      if (p.pay) coinPop(p.reg, p.pay);
      setTimeout(() => { el.classList.remove('talk'); go(); }, (p.pause || 0) / speed);
    }, ms);
  };
  void el.offsetWidth;
  go();
}

function coinPop(reg, text) {
  const stage = $('#stage'); if (!stage) return;
  const p = document.createElement('div');
  p.className = 'pop'; p.textContent = text;
  p.style.left = REG[reg || 0].x + '%'; p.style.top = (REG[reg || 0].y - 6) + '%';
  stage.appendChild(p);
  setTimeout(() => p.remove(), 1000);
}

function clearShoppers() { document.querySelectorAll('.shopper, .pop').forEach(e => e.remove()); }

function endDay() {
  clearInterval(dayTimer); dayTimer = null;
  const t = S.today;
  ACCESSORIES.forEach(a => { if (hasAcc(a.id) && a.income) t.income = round2(t.income + a.income); });
  S.cash = round2(S.cash + t.income);
  t.wages = wagesToday(); S.cash = round2(S.cash - t.wages);
  t.costs = round2(t.spent + t.insurance + t.wages + (t.other || 0));
  t.profit = round2(t.revenue + t.tips + t.income + (t.found || 0) + t.bonus + t.payout - t.costs);
  t.repay = 0;
  if (S.loan > 0 && t.profit > 0) {
    t.repay = round2(Math.max(0, Math.min(S.loan, round2(t.profit * CONFIG.loanRepayPct / 100), S.cash)));
    S.loan = round2(S.loan - t.repay); S.cash = round2(S.cash - t.repay);
  }
  t.review = dayReview();
  let repUp = (t.review.stars - 3) * 2;
  ACCESSORIES.forEach(a => { if (hasAcc(a.id) && a.repDaily) repUp += a.repDaily; });
  if (hasRoom('garden')) repUp += 1;
  if (hasStaff('greeter')) repUp += 1;
  const before = S.rep;
  S.rep = clamp(S.rep + repUp - (S.rep - 50) * CONFIG.repDecay, 0, 100);
  t.repDay = round2(S.rep - before); S.repTrend = Math.round(S.rep - (t.repStart != null ? t.repStart : before));
  S.history.push({ day: S.day, revenue: t.revenue, costs: t.costs, bonus: t.bonus, profit: t.profit, sold: { ...t.sold } });
  if (S.history.length > 90) S.history.shift();
  S.phase = 'evening';
  checkBadges();
  const ups = checkLevel();
  S.forecast = feature('events') ? { event: pick(['storm', 'outage', 'damage', 'thief']), chance: randInt(2, 6) } : null;
  save(); render();
  if (ups.length) showLevelUp(ups);
}

function updateLastHistory() {
  const t = S.today, h = S.history[S.history.length - 1];
  t.profit = round2(t.revenue + t.tips + t.income + (t.found || 0) + t.bonus + t.payout - t.costs);
  if (h && h.day === S.day) { h.bonus = t.bonus; h.profit = t.profit; }
}

/* Total profit is never reduced by buying accessories or rooms, so levels can't go backwards. */
function checkLevel() {
  const ups = [];
  while (CONFIG.levels[S.level] && totalProfit() >= CONFIG.levels[S.level].profit && (S.mathPoints || 0) >= CONFIG.levels[S.level].points) {
    S.level++; ups.push(S.level);
  }
  if (ups.length) checkBadges();
  return ups;
}

function checkBadges() {
  BADGES.forEach(b => {
    if (!S.badges.includes(b.id) && b.test()) { S.badges.push(b.id); toast(`Badge earned: ${b.emoji} ${b.name}`); }
  });
}

function nextDay() { S.day++; clearShoppers(); startDay(); window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' }); }

function unlocksFor(level) {
  const list = [];
  themeItems().forEach((d, i) => { if (CONFIG.itemLevels[i] === level) list.push(`${d.emoji} New item: ${esc(d.name)}`); });
  ACCESSORIES.filter(a => a.level === level).forEach(a => list.push(`${a.emoji} New accessory: ${a.name}${a.brings ? ` (brings ${SHOPPERS[a.brings].name}: see the Shopper guide)` : ''}`));
  ROOMS.filter(r => r.level === level).forEach(r => list.push(`${r.emoji} New room: ${r.name}`));
  STAFF.filter(x => x.level === level).forEach(x => list.push(`${x.emoji} You can now hire a ${x.name.toLowerCase()} (Staff tab)`));
  const f = CONFIG.features;
  if ([3, 5, 8, 11].includes(level)) list.push(`🧠 Maths questions get harder: now around ${TIER_TAG[baseTier()]}`);
  if (f.cents === level) list.push('🪙 Prices now use cents, and supplier prices change a little each day');
  if (f.sales === level) list.push('🏷️ You can run sales');
  if (f.bulk === level) list.push(`📦 Bulk deals: ${CONFIG.bulkDiscountPct}% off when you buy ${CONFIG.bulkThreshold} or more`);
  if (f.events === level) list.push('⛈️ Random events start. Check tomorrow\'s forecast each evening and buy insurance if you want');
  if (f.gst === level) list.push('🧾 Your receipt now shows GST');
  return list;
}

function showLevelUp(levels) {
  const top = levels[levels.length - 1];
  const items = levels.flatMap(unlocksFor);
  const box = openModal(`<h2>Level ${top} unlocked! ⭐</h2>
    <p>${items.length ? 'Here\'s what you can do now:' : 'Keep going!'}</p>
    <ul class="unlock-list">${items.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="hint">Accessories and rooms are in the shop upgrades section each evening.</p>
    <div class="actions"><button class="btn" id="lvlOk">Let's go</button></div>`, 'Level up');
  box.querySelector('#lvlOk').addEventListener('click', closeModal);
  box.querySelector('#lvlOk').focus();
}

function buyAccessory(id) {
  const a = ACCESSORIES.find(x => x.id === id);
  if (!a || hasAcc(id) || S.level < a.level || S.cash < a.cost) return;
  S.cash = round2(S.cash - a.cost); S.acc[id] = true;
  toast(`${a.emoji} ${a.name} added to your shop!`);
  checkBadges(); save(); render();
}

async function buyRoom(id) {
  const r = ROOMS.find(x => x.id === id);
  if (!r || hasRoom(id) || S.level < r.level || S.cash < r.cost) return;
  S.cash = round2(S.cash - r.cost); S.rooms[id] = true;
  if (id === 'security') S.rep = clamp(S.rep + 5, 0, 100);
  save(); render();
  await ask(Q.room(rollTier(), r.name));
  if (S.phase === 'evening') updateLastHistory();
  toast(`${r.emoji} ${r.name} is open!`);
  checkBadges(); save(); render();
}

/* Mid-day surprises */
const SURPRISES = ['bus', 'alarm', 'spill', 'radio', 'wallet', 'rush'];
function applySurprise(ctx) {
  const t = S.today, id = pick(SURPRISES);
  let msg = '';
  const addShoppers = k => { for (let i = 0; i < k; i++) ctx.times.push(ctx.elapsed + 300 + i * 350); ctx.times.sort((a, b) => a - b); };
  if (id === 'bus') { const k = 5 + S.level; addShoppers(k); msg = `🚌 A tour bus pulls up! ${k} extra shoppers are coming.`; }
  else if (id === 'alarm') { const left = ctx.times.length - ctx.idx, k = Math.min(left, Math.ceil(left * 0.25)); ctx.times.splice(ctx.idx, k); msg = `🚨 False fire alarm! Everyone had to step outside, and ${k} shopper${k === 1 ? '' : 's'} went home.`; }
  else if (id === 'spill') {
    if (hasStaff('clerk')) msg = '🧃 Someone spilled a drink! Your stock clerk cleaned it up straight away.';
    else { const c = round2(5 * (1 + 0.3 * (S.level - 1))); S.cash = round2(S.cash - c); t.other = round2((t.other || 0) + c); msg = `🧃 Someone spilled a drink! A cleaner cost ${money(c)}. A stock clerk would do it for free.`; }
  }
  else if (id === 'radio') { S.rep = clamp(S.rep + 3, 0, 100); addShoppers(4); msg = '📻 A radio host mentioned your shop on air. Reputation +3 and a few extra shoppers.'; }
  else if (id === 'wallet') { S.rep = clamp(S.rep + 4, 0, 100); msg = '👛 A shopper dropped their wallet and you handed it back. Word gets around: reputation +4.'; }
  else { t.rushLeft = 8; msg = '⚡ Flash crowd! The next 8 shoppers are in a buying mood.'; }
  t.surprise = msg; toast(msg);
  const el = $('#dayEvent'); if (el) { el.hidden = false; el.textContent = msg; }
  renderTop();
}

/* End-of-day reviews drive reputation */
function dayReview() {
  const t = S.today, m = t.mood || {}, c = Math.max(1, t.customers);
  const score = (2 * (m.loved || 0) + 1.5 * (m.happy || 0) + 0.5 * (m.okay || 0) - 1.5 * (m.walked || 0) - 2 * (m.soldout || 0)) / c;
  // The better your reputation, the fussier shoppers get, so high reputations are harder to hold
  const stars = clamp(Math.round(3 + score * 1.3 - Math.max(0, (S.rep - 60) / 25)), 1, 5);
  const lines = [];
  if ((m.soldout || 0) >= 3) lines.push(`"Came for ${t.soldOutItem ? esc(itemDef(t.soldOutItem).name.toLowerCase()) : 'something'} but it was sold out."`);
  if ((m.walked || 0) > c * 0.25) lines.push('"Prices are a bit steep here."');
  if ((m.loved || 0) > c * 0.3) lines.push('"Bargains everywhere!"');
  if ((m.happy || 0) > c * 0.3) lines.push('"Fair prices and a friendly shop."');
  const accs = ACCESSORIES.filter(a => hasAcc(a.id));
  if (accs.length && Math.random() < 0.5) lines.push(`"Love the ${pick(accs).name.toLowerCase()}!"`);
  if (hasStaff('greeter') && Math.random() < 0.5) lines.push('"The greeter made us feel so welcome."');
  if (!lines.length) lines.push('"A nice little shop."');
  return { stars, lines: lines.slice(0, 2) };
}

function bossSteps(id, tr) {
  const t = S.today;
  if (id === 'inspector') {
    let temp;
    if (tr <= 2) { const r = randInt(-14, -8); temp = { topic: 'int', title: 'Freezer check', q: `The freezer must be at −18°C or colder. It reads ${numStr(r)}°C. How many degrees colder must it get?`, answer: r + 18, hint: 'Count down on a number line from the reading to −18.', solution: `From ${numStr(r)}°C down to −18°C is ${r + 18} degrees.` }; }
    else if (tr <= 4) { const a = randInt(2, 6), drop = randInt(6, 12), rise = randInt(1, 4), v = a - drop + rise; temp = { topic: 'int', title: 'Fridge check', q: `The fridge was ${a}°C. Overnight it dropped ${drop} degrees, then rose ${rise} degrees. What does it read now?`, answer: v, display: numStr(v) + '°C', hint: `Start at ${a}, go down ${drop}, then up ${rise}.`, solution: `${a} − ${drop} + ${rise} = ${numStr(v)}°C.` }; }
    else { const v = [randInt(-8, -1), randInt(-6, 3), randInt(-9, -2), randInt(-4, 4)]; const s = v.reduce((a, b) => a + b, 0); v[3] -= ((s % 4) + 4) % 4; const s2 = v.reduce((a, b) => a + b, 0);
      temp = { topic: 'int', title: 'Freezer log', q: `Four freezer readings were ${v.map(x => numStr(x) + '°C').join(', ')}. What is the mean temperature?`, answer: s2 / 4, display: numStr(s2 / 4) + '°C', hint: 'Add them up (careful with the negatives), then divide by 4.', solution: `(${v.map(sgn).join(' + ')}) ÷ 4 = ${numStr(s2)} ÷ 4 = ${numStr(s2 / 4)}°C.` }; }
    return [Q.room(tr, 'kitchen'), temp];
  }
  if (id === 'celebrity') {
    const its = unlocked().filter(d => S.items[d.id].stock + (S.items[d.id].store || 0) > 0).sort((a, b) => b.fair - a.fair);
    if (!its.length) return [];
    const d = its[0], have = S.items[d.id].stock + (S.items[d.id].store || 0), n = Math.min(have, randInt(6, 15)), price = S.items[d.id].price, total = round2(n * price);
    const opt = [10, 20, 15, 12.5, [15, 5]][tr - 1];
    let pay, q2;
    if (Array.isArray(opt)) { const p1 = round2(total * 0.85); pay = round2(p1 * 0.95);
      q2 = { topic: 'pct', money: true, title: 'Negotiation', q: `The manager wants 15% off, then another 5% off for paying today. What's the final price?`, answer: pay, hint: 'Two steps: 85% of the total, then 95% of that.', solution: `85% of ${money(total)} = ${money(p1)}. 95% of ${money(p1)} = ${money(pay)}.` }; }
    else { pay = round2(total * (1 - opt / 100));
      q2 = { topic: 'pct', money: true, title: 'Negotiation', q: `The manager asks for ${opt}% off the total. What will they pay?`, answer: pay, hint: opt === 12.5 ? '12.5% is one-eighth.' : 'Find the discount, then take it away.', solution: `${opt}% of ${money(total)} = ${money(total - pay)}. ${money(total)} − ${money(total - pay)} = ${money(pay)}.` }; }
    t.bossCtx = { d: d.id, n, pay };
    return [{ topic: 'money', money: true, title: 'Big order', q: `The celebrity wants ${n} × ${esc(d.name)} at your price of ${money(price)} each. What's the total before any discount?`, answer: total, hint: `${n} × ${money(price)}.`, solution: `${n} × ${money(price)} = ${money(total)}.` }, q2];
  }
  if (id === 'truck') {
    const opts = unlocked().map(d => ({ d, space: (shelfMax() - S.items[d.id].stock) + (hasRoom('storage') ? CONFIG.storageMax - storageUsed() : 0) })).filter(o => o.space >= 10);
    if (!opts.length) return [];
    const o = pick(opts), d = o.d, unit = t.wholesale[d.id], n = Math.floor(Math.min(o.space, pick([40, 50, 60])) / 10) * 10;
    const pct = [20, 25, 30, 35, 40][tr - 1], total = round2(n * unit), off = round2(total * pct / 100), pay = round2(total - off);
    t.bossCtx = { d: d.id, n, pay };
    return [{ topic: 'money', money: true, title: 'Mega delivery', q: `The truck has ${n} × ${esc(d.name)} at the usual ${money(unit)} each. What's the full price?`, answer: total, hint: `Try ${n / 10} × ${money(unit * 10)}.`, solution: `${n} × ${money(unit)} = ${money(total)}.` },
      { topic: 'pct', money: true, title: 'Truckload discount', q: `Take the whole load and get ${pct}% off. What would you pay?`, answer: pay, hint: 'Find the discount, then take it away.', solution: `${pct}% of ${money(total)} = ${money(off)}. ${money(total)} − ${money(off)} = ${money(pay)}.` }];
  }
  if (id === 'auditor') {
    const h = S.history[S.history.length - 1];
    const R = h ? Math.round(h.revenue) : randInt(80, 300), C = h ? Math.round(h.costs) : randInt(60, 280), P = R - C;
    const q1 = { topic: 'int', title: 'Check the books', q: `Yesterday's sales were $${R} and costs were $${C} (rounded). What was the profit? Use a minus sign for a loss.`, answer: P, display: dollars(P), hint: 'Profit = sales − costs.', solution: `$${R} − $${C} = ${dollars(P)}.` };
    let q2;
    if (S.level >= CONFIG.features.gst && R > 0) { const g = round2(R / 11);
      q2 = { topic: 'gst', money: true, tol: 0.01, title: 'GST check', q: `$${R} of sales included GST. GST is 1/11 of GST-inclusive sales. How much GST do you owe?`, answer: g, hint: 'Divide by 11.', solution: `$${R} ÷ 11 = ${money(g)}.` }; }
    else { const sales = pick([200, 250, 400, 500]), p = pick([10, 20, 25, 40]);

  do { theirs = round2(mine * rand(1.1, 1.5)); sale = round2(theirs * (1 - pct / 100)); } while (Math.abs(sale - mine) < 0.1);
  const cheaper = sale < mine ? 1 : 0, diff = round2(Math.abs(mine - sale));
  return [{ topic: 'pct', title: 'Price battle', q: `The rival sells ${esc(d.name)} for ${money(theirs)} with ${pct}% off. You sell it for ${money(mine)}. Whose price is lower?`, choices: ['Mine', "The rival's"], correctIndex: cheaper, display: cheaper ? "The rival's" : 'Mine', hint: `Work out ${100 - pct}% of ${money(theirs)} first.`, solution: `Rival's sale price: ${100 - pct}% of ${money(theirs)} = ${money(sale)}. Yours: ${money(mine)}.` },
    { topic: 'money', money: true, title: 'Price battle', q: `What is the difference between your price (${money(mine)}) and the rival's sale price?`, answer: diff, hint: `The rival's sale price is ${100 - pct}% of ${money(theirs)}.`, solution: `The rival's sale price is ${money(sale)}. The difference is ${money(diff)}.` }];
}

async function runBoss() {
  const t = S.today;
  if (!t.boss || t.bossDone) return;
  let B = BOSSES.find(b => b.id === t.boss), tr = fixedTier(1), steps = bossSteps(B.id, tr);
  if (!steps.length) { t.boss = 'rival'; B = BOSSES.find(b => b.id === 'rival'); steps = bossSteps('rival', tr); toast(`Change of plan: ${B.emoji} ${B.name}!`); }
  let score = 0;
  for (const q of steps) {
    const r = await ask(Object.assign({ tier: tr }, q));
    if (r.outcome === 'right') score += 1; else if (r.outcome === 'retry') score += 0.5;
  }
  const n = steps.length, pass = score >= n - 0.5, perfect = score === n;
  const prize = Math.round(tierReward(tr) * 3 * (score / n) * (hasStaff('manager') ? 1.5 : 1));
  const notes = [];
  if (prize) { S.cash = round2(S.cash + prize); t.bonus = round2(t.bonus + prize); notes.push(`Boss prize: ${money(prize)}.`); }
  if (B.id === 'inspector') {
    const low = unlocked().filter(d => S.items[d.id].stock < 5);
    if (pass && !low.length) { S.rep = clamp(S.rep + 8, 0, 100); S.inspectionPassed = true; notes.push('You passed the inspection! Reputation +8.'); }
    else { S.rep = clamp(S.rep - 6, 0, 100); notes.push(low.length ? `Some shelves had fewer than 5 items (${low.map(d => d.emoji).join(' ')}). Reputation −6.` : 'The inspector wasn\'t happy with your answers. Reputation −6.'); }
  } else if (B.id === 'celebrity') {
    const c = t.bossCtx, it = S.items[c.d], d = itemDef(c.d);
    let need = c.n; const fromStore = Math.min(need, it.store || 0); it.store = (it.store || 0) - fromStore; need -= fromStore; it.stock -= need;
    t.revenue = round2(t.revenue + c.pay); S.cash = round2(S.cash + c.pay); t.sold[c.d] = (t.sold[c.d] || 0) + c.n;
    notes.push(`You sold ${c.n} × ${d.emoji} ${esc(d.name)} for ${money(c.pay)}.`);
    if (pass) { S.rep = clamp(S.rep + 6, 0, 100); S.vipSale = true; notes.push('The celebrity posted about your shop. Reputation +6.'); }
  } else if (B.id === 'truck') {
    const c = t.bossCtx, d = itemDef(c.d);
    if (S.cash >= c.pay && await confirmBox('Buy the truckload?', `${c.n} × ${d.name} for ${money(c.pay)}. It goes on the shelf first, then into storage.`, 'Buy it')) {
      S.cash = round2(S.cash - c.pay); t.spent = round2(t.spent + c.pay);
      const it = S.items[c.d], toShelf = Math.min(c.n, shelfMax() - it.stock); it.stock += toShelf; it.store = (it.store || 0) + (c.n - toShelf);
      notes.push(`You bought ${c.n} × ${d.emoji} ${esc(d.name)} for ${money(c.pay)}.`);
    } else notes.push(S.cash < c.pay ? 'You didn\'t have enough cash for the truckload.' : 'You turned the truckload down.');
  } else if (B.id === 'auditor') {
    if (!pass) { const fine = tierReward(tr); S.cash = round2(S.cash - fine); t.other = round2((t.other || 0) + fine); notes.push(`Your books had mistakes: ${money(fine)} fine.`); }
    else notes.push('Your books are perfect. The auditor leaves happy.');
  } else {
    if (pass) { t.bossBoost = 1.2; S.rep = clamp(S.rep + 4, 0, 100); notes.push('You won the price battle! About 20% more shoppers today and reputation +4.'); }
    else { t.bossBoost = 0.85; notes.push('The rival won this round and pinched about 15% of your shoppers today.'); }
  }
  if (pass) S.bossWins = (S.bossWins || 0) + 1;
  t.bossDone = true;
  t.bossResult = `${perfect ? 'Perfect! ' : pass ? 'Boss beaten! ' : 'The boss won this time. '}${notes.join(' ')}`;
  checkBadges(); save(); render();
  const box = openModal(`<h2>${B.emoji} ${perfect ? 'Perfect boss day!' : pass ? 'Boss beaten!' : 'Not this time'}</h2><p>You scored ${numStr(score)} out of ${n}.</p><p>${notes.join('</p><p>')}</p><div class="actions"><button class="btn" id="bossOk">Back to the shop</button></div>`, 'Boss result');
  box.querySelector('#bossOk').addEventListener('click', closeModal);
  box.querySelector('#bossOk').focus();
}

/* ---------- Staff ---------- */
function wageQuestion(tr, s, rate) {
  const h = CONFIG.staffHours, daily = round2(rate * h), nm = s.name.toLowerCase();
  if (tr <= 2) { const r = Math.max(1, Math.round(rate)); return { tier: tr, topic: 'money', money: true, title: 'Working out wages', q: `If a ${nm} earned $${r} an hour for ${h} hours, how much would that be for the day?`, answer: r * h, hint: `${r} × ${h}.`, solution: `$${r} × ${h} = $${r * h}.` }; }
  if (tr === 3) return { tier: 3, topic: 'money', money: true, title: 'Working out wages', q: `Your ${nm} earns ${money(rate)} an hour and works ${h} hours. What is their daily pay?`, answer: daily, hint: `${h} × $${Math.floor(rate)}, plus ${h} × ${Math.round((rate % 1) * 100)}c.`, solution: `${money(rate)} × ${h} = ${money(daily)}.` };
  if (tr === 4) { const w = round2(daily * 5); return { tier: 4, topic: 'money', money: true, title: 'Weekly pay', q: `Your ${nm} earns ${money(rate)} an hour, works ${h} hours a day and 5 days a week. What is their weekly pay?`, answer: w, hint: `Daily pay first (${money(rate)} × ${h}), then × 5.`, solution: `${money(rate)} × ${h} = ${money(daily)} a day. × 5 = ${money(w)}.` }; }
  const sup = round2(daily * 0.12);
  return { tier: 5, topic: 'pct', money: true, title: 'Wages and super', q: `Your ${nm} earns ${money(daily)} a day. Employers also pay 12% superannuation on top. How much super is that per day?`, answer: sup, hint: '12% = 10% + 2%.', solution: `10% of ${money(daily)} = ${money(daily * 0.1)} and 2% = ${money(daily * 0.02)}. Together: ${money(sup)}.` };
}
async function hireStaff(id) {
  const s = STAFF.find(x => x.id === id);
  if (!s || hasStaff(id) || S.level < s.level) return;
  await ask(wageQuestion(rollTier(), s, staffRate(s)));
  S.staff[id] = true;
  toast(`${s.emoji} ${s.name} hired!`);
  checkBadges(); save(); render();
}
async function fireStaff(id) {
  const s = STAFF.find(x => x.id === id);
  if (!s || !hasStaff(id)) return;
  if (!await confirmBox(`Let your ${s.name.toLowerCase()} go?`, 'You will stop paying their wages, and you lose their help.', 'Let them go')) return;
  delete S.staff[id];
  save(); render();
}

    const st = S.items[d.id].stock, icons = st ? Math.max(1, Math.ceil(st / max * 6)) : 0;

    return `<div class="shelf-unit ${hasAcc('shelves') ? 'big' : ''} ${st ? '' : 'empty'}" style="left:${shelfX(i) - w / 2}%;width:${w}%" title="${esc(d.name)}: ${st} on the shelf">

  }).join('');
